name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.0'

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Show generated JAR
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs || true
          echo "=== JAR FILES ==="
          find . -type f -name "*.jar" -print

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-stalker
          path: build/libs/*.jar
          if-no-files-found: error
