name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Check generated JAR
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -la build/libs || true
          echo "=== all JAR files ==="
          find . -type f -name "*.jar" -print

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-stalker-jar
          path: build/libs/*.jar
          if-no-files-found: error
