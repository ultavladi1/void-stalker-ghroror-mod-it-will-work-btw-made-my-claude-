name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.3.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.3.0/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build Mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Find JAR
        if: always()
        run: |
          echo "=== JARS ==="
          find . -type f -name "*.jar" -print
          echo "=== BUILD/LIBS ==="
          ls -lah build/libs || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-stalker
          path: build/libs/*.jar
          if-no-files-found: error
