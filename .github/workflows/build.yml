name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: |
          ./gradlew clean jar --no-daemon --stacktrace --info > build-log.txt 2>&1 || true
          cat build-log.txt

      - name: Show JAR files
        if: always()
        run: |
          echo "=== JAR FILES ==="
          find . -type f -name "*.jar" -print
          echo "=== BUILD LOG ==="
          cat build-log.txt

      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-stalker-jar
          path: build/libs/*.jar
          if-no-files-found: warn
